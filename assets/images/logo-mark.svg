<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="msdShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.22" />
    </filter>
    <linearGradient id="ghsRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <linearGradient id="cyanCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- GHS Diamond (Rotated Square on Point) -->
  <rect x="96" y="96" width="320" height="320" rx="48" ry="48" 
        transform="rotate(45 256 256)" 
        fill="#FFFFFF" 
        stroke="url(#ghsRed)" 
        stroke-width="38" 
        stroke-linejoin="round"
        filter="url(#msdShadow)" />

  <!-- Benzene Hexagon Bonds (Obsidian Slate #0F172A) -->
  <polygon points="256,174 327,215 327,297 256,338 185,297 185,215" 
           fill="none" stroke="#0F172A" stroke-width="24" stroke-linejoin="round" />

  <!-- Triad Molecular Radial Spokes -->
  <line x1="256" y1="174" x2="256" y2="256" stroke="#0F172A" stroke-width="20" stroke-linecap="round" />
  <line x1="327" y1="297" x2="256" y2="256" stroke="#0F172A" stroke-width="20" stroke-linecap="round" />
  <line x1="185" y1="297" x2="256" y2="256" stroke="#0F172A" stroke-width="20" stroke-linecap="round" />

  <!-- Central Data Nucleus with Protective White Halo -->
  <circle cx="256" cy="256" r="28" fill="url(#cyanCore)" stroke="#FFFFFF" stroke-width="8" />

  <!-- 6 Outer Benzene Vertex Atom Nodes -->
  <circle cx="256" cy="174" r="22" fill="#0F172A" stroke="#FFFFFF" stroke-width="5" />
  <circle cx="327" cy="215" r="20" fill="#0F172A" stroke="#FFFFFF" stroke-width="5" />
  <circle cx="327" cy="297" r="22" fill="#0F172A" stroke="#FFFFFF" stroke-width="5" />
  <circle cx="256" cy="338" r="20" fill="#0F172A" stroke="#FFFFFF" stroke-width="5" />
  <circle cx="185" cy="297" r="22" fill="#0F172A" stroke="#FFFFFF" stroke-width="5" />
  <circle cx="185" cy="215" r="20" fill="#0F172A" stroke="#FFFFFF" stroke-width="5" />
</svg>
# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices/configuration.html#application-related-configuration
parameters:
    locale: 'en'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        public: false

    _instanceof:
        App\Service\SubstanceLoaderInterface:
            tags: ['app.substance_loader']

    # makes classes in src/ available to be used as services
    App\:
        resource: '../src/*'
        exclude: '../src/{Entity,Migrations,Tests,Kernel.php}'

    # controllers are imported separately
    App\Controller\:
        resource: '../src/Controller'
        tags: ['controller.service_arguments']

    # Concrete Substance Loaders with Priorities
    App\Service\PubChemSubstanceLoader:
        tags:
            - { name: 'app.substance_loader', priority: 100 }

    App\Service\WikiDataSubstanceLoader:
        tags:
            - { name: 'app.substance_loader', priority: 80 }

    App\Service\EchaSubstanceLoader:
        tags:
            - { name: 'app.substance_loader', priority: 75 }

    App\Service\ChebiSubstanceLoader:
        tags:
            - { name: 'app.substance_loader', priority: 70 }

    App\Service\CompToxSubstanceLoader:
        tags:
            - { name: 'app.substance_loader', priority: 60 }

    App\Service\NistSubstanceLoader:
        tags:
            - { name: 'app.substance_loader', priority: 50 }

    App\Service\GestisSubstanceLoader:
        tags:
            - { name: 'app.substance_loader', priority: 40 }

    App\Service\SigmaAldrichSubstanceLoader:
        tags:
            - { name: 'app.substance_loader', priority: 20 }

    # Twig Extensions
    App\Twig\ChemicalExtension:
        tags: ['twig.extension']

    # GHS Label Generator
    App\Service\GhsLabelGenerator:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # Chain Loader injecting all tagged loaders
    App\Service\ChainSubstanceLoader:
        arguments:
            $loaders: !tagged_iterator app.substance_loader

    # Bind Interface to Chain Loader
    App\Service\SubstanceLoaderInterface: '@App\Service\ChainSubstanceLoader'


